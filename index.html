<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Datilologia em Libras</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --accent: #ff9f43;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    .nav-modes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn-mode {
      background: var(--bg-color);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mode.active, .btn-mode:hover {
      background: var(--primary);
      color: white;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 320px;
      justify-content: center;
    }

    .hand-display {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
      min-height: 120px;
      align-items: center;
    }

    .hand-card {
      width: 90px;
      height: 110px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .hand-card img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .btn-option {
      background: var(--card-bg);
      border: 2px solid #cbd5e1;
      padding: 12px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    input[type="text"] {
      padding: 12px 20px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      text-align: center;
      text-transform: uppercase;
      width: 250px;
      margin-bottom: 15px;
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

    <h1>Desafio de Datilologia em Libras 🤟</h1>
    <p>Aprenda e pratique o alfabeto manual!</p>
  </header>

  <div class="container">
    <div class="score-board">
      <span id="score-display">Pontos: 0</span>
      <span id="mode-title">Modo: Descubra a Palavra</span>
    </div>

    <div class="nav-modes">
      <button class="btn-mode active" onclick="switchMode('read-word', event)">1. Descubra a Palavra</button>
      <button class="btn-mode" onclick="switchMode('match-letter', event)">2. Qual é a Letra?</button>
      <button class="btn-mode" onclick="switchMode('speed-run', event)">3. Desafio Rápido</button>
    </div>

    <div class="game-area" id="game-area">
      <!-- Conteúdo do jogo gerado dinamicamente -->
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    // CAMINHO RELATIVO LOCAL DAS IMAGENS
    const FOLDER_PATH = "./assets/alfabeto";
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let imagesBank = {};

    // Estado do jogo
    let currentMode = 'read-word';
    let score = 0;
    let currentTarget = null;

    // Inicialização direta usando caminhos relativos
    function initGame() {
      ALPHABET.forEach(letter => {
        // Mapeia cada letra para a imagem .png correspondente
        imagesBank[letter] = `${FOLDER_PATH}/${letter}.png`;
      });
      renderGame();
    }

    function switchMode(mode, evt) {
      currentMode = mode;
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      document.getElementById('feedback').innerText = '';
      
      const titles = {
        'read-word': 'Modo: Descubra a Palavra',
        'match-letter': 'Modo: Qual é a Letra?',
        'speed-run': 'Modo: Desafio Rápido'
      };
      document.getElementById('mode-title').innerText = titles[mode];
      
      renderGame();
    }

    function renderGame() {
      const area = document.getElementById('game-area');
      area.innerHTML = '';

      if (currentMode === 'read-word') {
        const words = ["SOL", "CASA", "AMIGO", "LIBRAS", "JOGO", "ESCOLA", "FLOR", "BOM", "VIDA"];
        currentTarget = words[Math.floor(Math.random() * words.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

          card.className = 'hand-card';
          const img = document.createElement('img');
          img.src = imagesBank[char];
          img.alt = `Sinal da letra ${char}`;
          
          // Tratamento para caso a imagem individual falhe ao carregar
          img.onerror = () => {
            img.style.display = 'none';
            card.innerText = char; // Exibe a letra como fallback se a imagem faltar
            card.style.fontSize = '24px';
            card.style.fontWeight = 'bold';
          };

          card.appendChild(img);
          handDisplay.appendChild(card);
        });

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'word-input';
        input.placeholder = 'Digite a palavra...';
        input.maxLength = currentTarget.length;
        input.onkeyup = (e) => { if (e.key === 'Enter') checkWordAnswer(input.value.trim().toUpperCase()); };

        const btn = document.createElement('button');
        btn.className = 'btn-submit';
        btn.innerText = 'Verificar';
        btn.onclick = () => checkWordAnswer(input.value.trim().toUpperCase());

        area.appendChild(handDisplay);
        area.appendChild(input);
        area.appendChild(btn);
        setTimeout(() => input.focus(), 100);

        currentTarget = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        const card = document.createElement('div');
        card.className = 'hand-card';
        card.style.width = '140px';
        card.style.height = '160px';

        const img = document.createElement('img');
        img.src = imagesBank[currentTarget];
        img.alt = `Sinal da letra em Libras`;
