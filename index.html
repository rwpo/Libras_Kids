<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Datilologia em Libras</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --accent: #ff9f43;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    .nav-modes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn-mode {
      background: var(--bg-color);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mode.active, .btn-mode:hover {
      background: var(--primary);
      color: white;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 320px;
      justify-content: center;
    }

    .hand-display {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
      min-height: 120px;
      align-items: center;
    }

    .hand-card {
      width: 90px;
      height: 110px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .hand-card img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .word-slot {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .letter-slot {
      width: 40px;
      height: 50px;
      border-bottom: 3px solid var(--primary);
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      line-height: 50px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .btn-option {
      background: var(--card-bg);
      border: 2px solid #cbd5e1;
      padding: 12px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    input[type="text"] {
      padding: 12px 20px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      text-align: center;
      text-transform: uppercase;
      width: 250px;
      margin-bottom: 15px;
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desafio de Datilologia em Libras 🤟</h1>
    <p>Aprenda e pratique o alfabeto manual!</p>
  </header>

  <div class="container">
    <div class="score-board">
      <span id="score-display">Pontos: 0</span>
      <span id="level-display">Atividade 1/3</span>
    </div>

    <div class="nav-modes">
      <button class="btn-mode active" onclick="switchMode('read-word')">1. Descubra a Palavra</button>
      <button class="btn-mode" onclick="switchMode('match-letter')">2. Qual é a Letra?</button>
      <button class="btn-mode" onclick="switchMode('speed-run')">3. Desafio Rápido</button>
    </div>

    <div class="game-area" id="game-area">
      <!-- Conteúdo injetado via JavaScript -->
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    // CONFIGURAÇÃO DO BANCO DE IMAGENS
    // Altere para o seu usuário e repositório no GitHub
    const REPO_CONFIG = {
      owner: "seu-usuario-github",
      repo: "seu-repositorio",
      branch: "main",
      folderPath: "assets/alfabeto"
    };

    // Mapeamento local padrão (Fallback caso a API não esteja conectada)
    const LOCAL_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let imagesBank = {};

    // Estado do jogo
    let currentMode = 'read-word';
    let score = 0;
    let currentTarget = null;

    // Inicialização
    async function initGame() {
      await loadImagesFromGitHub();
      renderGame();
    }

    // Busca dinâmica de imagens do repositório via API do GitHub
    async function loadImagesFromGitHub() {
      const url = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folderPath}?ref=${REPO_CONFIG.branch}`;
      
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Repositório local ou caminho não encontrado.");
        
        const files = await response.json();
        
        files.forEach(file => {
          // Espera arquivos com nome A.png, B.png, etc.
          const letterMatch = file.name.match(/^([a-zA-Z])\.(png|jpg|jpeg|svg)$/i);
          if (letterMatch) {
            const letter = letterMatch[1].toUpperCase();
            imagesBank[letter] = file.download_url;
          }
        });
      } catch (err) {
        console.warn("Usando caminhos locais de fallback para imagens:", err.message);
        // Fallback: carrega do caminho relativo assets/alfabeto/A.png
        LOCAL_ALPHABET.forEach(letter => {
          imagesBank[letter] = `./${REPO_CONFIG.folderPath}/${letter}.png`;
        });
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('feedback').innerText = '';
      renderGame();
    }

    function renderGame() {
      const area = document.getElementById('game-area');
      area.innerHTML = '';

      if (currentMode === 'read-word') {
        const words = ["SOL", "CASA", "AMIGO", "LIBRAS", "JOGO", "ESCOLA", "FLOR"];
        currentTarget = words[Math.floor(Math.random() * words.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        currentTarget.split('').forEach(char => {
          const card = document.createElement('div');
          card.className = 'hand-card';
          const img = document.createElement('img');
          img.src = imagesBank[char] || '';
          img.alt = `Sinal da letra ${char}`;
          card.appendChild(img);
          handDisplay.appendChild(card);
        });

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'word-input';
        input.placeholder = 'Digite a palavra...';
        input.maxLength = currentTarget.length;

        const btn = document.createElement('button');
        btn.className = 'btn-submit';
        btn.innerText = 'Verificar';
        btn.onclick = () => checkWordAnswer(input.value.trim().toUpperCase());

        area.appendChild(handDisplay);
        area.appendChild(input);
        area.appendChild(btn);

      } else if (currentMode === 'match-letter') {
        const letters = Object.keys(imagesBank);
        currentTarget = letters[Math.floor(Math.random() * letters.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        const card = document.createElement('div');
        card.className = 'hand-card';
        card.style.width = '140px';
        card.style.height = '160px';

        const img = document.createElement('img');
        img.src = imagesBank[currentTarget];
        img.alt = `Sinal da letra`;
        card.appendChild(img);
        handDisplay.appendChild(card);

        // Gerar 4 opções
        let options = [currentTarget];
        while (options.length < 4) {
          let rand = letters[Math.floor(Math.random() * letters.length)];
          if (!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        options.forEach(opt => {
          const optBtn = document.createElement('button');
          optBtn.className = 'btn-option';
          optBtn.innerText = opt;
          optBtn.onclick = () => checkOptionAnswer(opt);
          optionsGrid.appendChild(optBtn);
        });

        area.appendChild(handDisplay);
        area.appendChild(optionsGrid);

      } else if (currentMode === 'speed-run') {
        // Desafio rápido: associação direta com cronômetro visual
