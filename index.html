<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Datilologia em Libras</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #2c3e50;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin: 0 0 5px 0;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 15px;
    }

    .nav-modes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn-mode {
      background: var(--bg-color);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-mode.active {
      background: var(--primary);
      color: white;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 250px;
      justify-content: center;
    }

    .hand-display {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .hand-card {
      width: 80px;
      height: 100px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }

    .hand-card img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .btn-option {
      background: var(--card-bg);
      border: 2px solid #cbd5e1;
      padding: 12px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
      text-transform: uppercase;
      width: 200px;
      margin-bottom: 15px;
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      min-height: 25px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desafio de Datilologia em Libras 🤟</h1>
    <p>Aprenda e pratique o alfabeto manual!</p>
  </header>

  <div class="container">
    <div class="score-board">
      <span id="score-display">Pontos: 0</span>
      <span id="mode-title">Modo: Descubra a Palavra</span>
    </div>

    <div class="nav-modes">
      <button id="btn-mode-1" class="btn-mode active" onclick="setMode('read-word')">1. Descubra a Palavra</button>
      <button id="btn-mode-2" class="btn-mode" onclick="setMode('match-letter')">2. Qual é a Letra?</button>
      <button id="btn-mode-3" class="btn-mode" onclick="setMode('speed-run')">3. Desafio Rápido</button>
    </div>

    <div class="game-area" id="game-area"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>

    const ALPHABET = Object.keys(IMAGES);
    let currentMode = 'read-word';

    function setMode(mode) {
      currentMode = mode;
      
      document.getElementById('btn-mode-1').className = mode === 'read-word' ? 'btn-mode active' : 'btn-mode';
      document.getElementById('btn-mode-2').className = mode === 'match-letter' ? 'btn-mode active' : 'btn-mode';
      document.getElementById('btn-mode-3').className = mode === 'speed-run' ? 'btn-mode active' : 'btn-mode';

      const titles = {
        'read-word': 'Modo: Descubra a Palavra',
        'match-letter': 'Modo: Qual é a Letra?',
        'speed-run': 'Modo: Desafio Rápido'
      };
      document.getElementById('mode-title').innerText = titles[mode];
      document.getElementById('feedback').innerText = '';

      render();
    }

      const area = document.getElementById('game-area');
      area.innerHTML = '';

      if (currentMode === 'read-word') {
        const words = ["SOL", "CASA", "AMIGO", "LIBRAS", "JOGO", "ESCOLA", "FLOR", "BOM", "VIDA"];
        target = words[Math.floor(Math.random() * words.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        target.split('').forEach(letter => {
          const card = document.createElement('div');
          card.className = 'hand-card';
          const img = document.createElement('img');
          img.src = IMAGES[letter] || '';
          img.alt = letter;
          card.appendChild(img);
          handDisplay.appendChild(card);
        });

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'word-input';
        input.placeholder = 'Digite aqui...';
        input.maxLength = target.length;

        const btn = document.createElement('button');
        btn.className = 'btn-submit';
        btn.innerText = 'Verificar';
        btn.onclick = function() { checkWord(input.value.trim().toUpperCase()); };

        area.appendChild(handDisplay);
        area.appendChild(input);
        area.appendChild(btn);

      } else if (currentMode === 'match-letter') {
        target = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        const card = document.createElement('div');
        card.className = 'hand-card';
        card.style.width = '120px';
        card.style.height = '140px';

        const img = document.createElement('img');
        img.src = IMAGES[target];
        img.alt = target;
        card.appendChild(img);
        handDisplay.appendChild(card);

        let options = [target];
        while (options.length < 4) {
          let rand = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
          if (!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'btn-option';
          btn.innerText = opt;
          btn.onclick = function() { checkOption(opt); };
          optionsGrid.appendChild(btn);
        });

        area.appendChild(handDisplay);
