<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libras Kids - Alfabeto e Datilologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --yellow: #FFE66D;
      --purple: #8B5CF6;
      --blue: #3B82F6;
      --green: #10B981;
      --dark: #2D3748;
      --light: #F7FAFC;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    body {
      background-color: #F0F4F8;
      background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .font-fun {
      font-family: 'Fredoka', cursive;
    }

    header {
      background: linear-gradient(135deg, #6EE7B7, #3B82F6, #9333EA);
      color: white;
      padding: 1.2rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 2.2rem;
      background: rgba(255,255,255,0.2);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-title {
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    nav {
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,0.2);
      padding: 5px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: white;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn.active, .nav-btn:hover {
      background: white;
      color: var(--purple);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 20px auto;
      padding: 0 15px;
    }

    .section-panel {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .section-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY
