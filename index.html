<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio de Datilologia em Libras</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --accent: #ff9f43;
      --success: #2ecc71;
      --danger: #e74c3c;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    .nav-modes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn-mode {
      background: var(--bg-color);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-mode.active, .btn-mode:hover {
      background: var(--primary);
      color: white;
    }

    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 320px;
      justify-content: center;
    }

    .hand-display {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
      min-height: 120px;
      align-items: center;
    }

    .hand-card {
      width: 90px;
      height: 110px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .hand-card img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .btn-option {
      background: var(--card-bg);
      border: 2px solid #cbd5e1;
      padding: 12px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    input[type="text"] {
      padding: 12px 20px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      text-align: center;
      text-transform: uppercase;
      width: 250px;
      margin-bottom: 15px;
    }

    .btn-submit {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    .feedback {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desafio de Datilologia em Libras 🤟</h1>
    <p>Aprenda e pratique o alfabeto manual!</p>
  </header>

  <div class="container">
    <div class="score-board">
      <span id="score-display">Pontos: 0</span>
      <span id="mode-title">Modo: Descubra a Palavra</span>
    </div>

    <div class="nav-modes">
      <button class="btn-mode active" onclick="switchMode('read-word', event)">1. Descubra a Palavra</button>
      <button class="btn-mode" onclick="switchMode('match-letter', event)">2. Qual é a Letra?</button>
      <button class="btn-mode" onclick="switchMode('speed-run', event)">3. Desafio Rápido</button>
    </div>

    <div class="game-area" id="game-area">
      <!-- Conteúdo do jogo gerado dinamicamente -->
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    // Banco de imagens hospedadas via URLs públicas
    const ONLINE_IMAGES = {
      'A': 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Sign_language_A.svg/120px-Sign_language_A.svg.png',
      'B': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Sign_language_B.svg/120px-Sign_language_B.svg.png',
      'C': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Sign_language_C.svg/120px-Sign_language_C.svg.png',
      'D': 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Sign_language_D.svg/120px-Sign_language_D.svg.png',
      'E': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Sign_language_E.svg/120px-Sign_language_E.svg.png',
      'F': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Sign_language_F.svg/120px-Sign_language_F.svg.png',
      'G': 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Sign_language_G.svg/120px-Sign_language_G.svg.png',
      'H': 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Sign_language_H.svg/120px-Sign_language_H.svg.png',
      'I': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Sign_language_I.svg/120px-Sign_language_I.svg.png',
      'J': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Sign_language_J.svg/120px-Sign_language_J.svg.png',
      'K': 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Sign_language_K.svg/120px-Sign_language_K.svg.png',
      'L': 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Sign_language_L.svg/120px-Sign_language_L.svg.png',
      'M': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Sign_language_M.svg/120px-Sign_language_M.svg.png',
      'N': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Sign_language_N.svg/120px-Sign_language_N.svg.png',
      'O': 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Sign_language_O.svg/120px-Sign_language_O.svg.png',
      'P': 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Sign_language_P.svg/120px-Sign_language_P.svg.png',
      'Q': 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Sign_language_Q.svg/120px-Sign_language_Q.svg.png',
      'R': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Sign_language_R.svg/120px-Sign_language_R.svg.png',
      'S': 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Sign_language_S.svg/120px-Sign_language_S.svg.png',
      'T': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Sign_language_T.svg/120px-Sign_language_T.svg.png',
      'U': 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Sign_language_U.svg/120px-Sign_language_U.svg.png',
      'V': 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Sign_language_V.svg/120px-Sign_language_V.svg.png',
      'W': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Sign_language_W.svg/120px-Sign_language_W.svg.png',
      'X': 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Sign_language_X.svg/120px-Sign_language_X.svg.png',
      'Y': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Sign_language_Y.svg/120px-Sign_language_Y.svg.png',
      'Z': 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Sign_language_Z.svg/120px-Sign_language_Z.svg.png'
    };

    const ALPHABET = Object.keys(ONLINE_IMAGES);
    let imagesBank = ONLINE_IMAGES;

    let currentMode = 'read-word';
    let score = 0;
    let currentTarget = null;

    function initGame() {
      renderGame();
    }

    function switchMode(mode, evt) {
      currentMode = mode;
      document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      document.getElementById('feedback').innerText = '';
      
      const titles = {
        'read-word': 'Modo: Descubra a Palavra',
        'match-letter': 'Modo: Qual é a Letra?',
        'speed-run': 'Modo: Desafio Rápido'
      };
      document.getElementById('mode-title').innerText = titles[mode];
      
      renderGame();
    }

    function renderGame() {
      const area = document.getElementById('game-area');
      area.innerHTML = '';

      if (currentMode === 'read-word') {
        const words = ["SOL", "CASA", "AMIGO", "LIBRAS", "JOGO", "ESCOLA", "FLOR", "BOM", "VIDA"];
        currentTarget = words[Math.floor(Math.random() * words.length)];

        const handDisplay = document.createElement('div');
        handDisplay.className = 'hand-display';

        currentTarget.split('').forEach(char => {
          const card = document.createElement('div');
          card.className = 'hand-card';
          
          const img = document.createElement('img');
          img.src = imagesBank[char];
